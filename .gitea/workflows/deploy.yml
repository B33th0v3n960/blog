name: Deploy blog on release
run-name: ${{ gitea.actor }} deploy blog on ${{ gitea.event_name }}

on: [push]

jobs:
 build:
      runs-on: ubuntu-latest
      steps:
        - name: Check out repository code
          uses: actions/checkout@v4
        
        - name: Login to docker
          run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login gitea.b33th0v3n.com --username ${{secrets.USERNAME}} --password-stdin
        
        - name: Set release name
          run: echo "RELEASE=release-${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
               echo $RELEASE

        - name: Build the Image
          run: docker build -t gitea.b33th0v3n.com/${{secrets.USERNAME}}/blog:$RELEASE .

        - name: Push the Image
          run: docker push gitea.b33th0v3n.com/${{secrets.USERNAME}}/blog:$RELEASE
