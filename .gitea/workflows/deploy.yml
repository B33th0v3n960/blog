name: Build docker image of blog
run-name: ${{ gitea.actor }} build blog docker image on ${{ gitea.event_name }}

on:
  push:
    tags:
      - 'v*'

jobs:
  build-container:
      runs-on: ubuntu-latest
      env:
       DOCKER_ADDRESS: gitea.b33th0v3n.com
       ARTIFACT_NAME: blog
       DOCKER_LATEST: nightly
       RUNNER_TOOL_CACHE: /toolcache
         
      steps:
        - name: Check out repository code
          uses: actions/checkout@v4

        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: '24'

        - name: Build Website
          run: | 
            npm ci
            npm run build

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v2

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
       
        - name: Login to docker
          run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{env.DOCKER_ADDRESS}} --username ${{secrets.USERNAME}} --password-stdin
       
        - name: Get Meta
          id: meta
          run: |
            echo REPO_NAME=$(echo ${GITHUB_REPOSITORY} | awk -F"/" '{print $2}') >> $GITHUB_OUTPUT
            echo REPO_VERSION=$(git describe --tags --always | sed 's/^v//') >> $GITHUB_OUTPUT                

        - name: Build the Image
          run: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              -t ${{env.DOCKER_ADDRESS}}/${{secrets.USERNAME}}/${{env.ARTIFACT_NAME}}:${{steps.meta.outputs.REPO_VERSION}} \
              -t ${{env.DOCKER_ADDRESS}}/${{secrets.USERNAME}}/${{env.ARTIFACT_NAME}}:latest \
              .
